name: Build miatoll kernel

# Public repo: Actions minutes are free. Builds both variants so a
# broken defconfig/fragment (e.g. the THP try_to_unmap case) is caught
# before flashing. Pushing a v* tag also publishes a GitHub Release
# with both flashable zips attached. Every push to 16.0 replaces the
# rolling "unreleased" pre-release with this build and its CHANGELOG
# [Unreleased] section.
#
# Put a marker in the commit message of a push to skip part of the build:
#   [skip kernel] or [skip kernel build]  skips both kernel builds
#   [skip module] or [skip module build]  skips the Kernel Control module build
#   [skip ci], [skip-ci], [ci skip], [no ci]  skips everything
# When only one build ran, the pre-release is still updated with it: the other build's files
# stay in the release and the manifest lists both. Pull requests, manual runs and v* tags
# always build everything.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # No name here on purpose. A matrix job that is skipped is never expanded, so GitHub would
    # show the raw "${{ matrix.variant }}" template as its title. Without a name the title is
    # "build (default)" and "build (nethunter)" when it runs, and just "build" when it is skipped.
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip-ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[no ci]') && (startsWith(github.ref, 'refs/tags/v') || (!contains(github.event.head_commit.message, '[skip kernel]') && !contains(github.event.head_commit.message, '[skip kernel build]')))"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [default, nethunter]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex libelf-dev \
            libssl-dev rsync unzip zip zlib1g-dev

      - name: Restore ccache (5 GB cap, per variant)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.variant }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ github.ref_name }}-
            ccache-${{ matrix.variant }}-

      - name: Restore Proton Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/proton-clang
          key: proton-clang-13-${{ runner.os }}

      - name: Fetch Proton Clang 13
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/kdrag0n/proton-clang.git \
            "${{ runner.temp }}/proton-clang"

      - name: Syntax check helper scripts
        run: |
          bash -n build_miatoll.sh
          bash -n AnyKernel3/anykernel.sh

      - name: Build Image.gz + flashable zip
        env:
          CLANG_DIR: ${{ runner.temp }}/proton-clang/bin
          USE_CCACHE: "1"
          CCACHE_MAXSIZE: 5G
        run: |
          ccache -z
          if [ "${{ matrix.variant }}" = "nethunter" ]; then
            export NETHUNTER=1
          fi
          bash ./build_miatoll.sh "miatoll-${{ matrix.variant }}-${{ github.run_number }}.zip"
          ccache -s
          cp out/arch/arm64/boot/Image.gz \
            "Image-${{ matrix.variant }}-${{ github.run_number }}.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-${{ matrix.variant }}-${{ github.run_number }}
          path: |
            miatoll-*.zip
            Image-*.gz
          if-no-files-found: error
          retention-days: 14

  module:
    name: Build Kernel Control module
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip-ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[no ci]') && (startsWith(github.ref, 'refs/tags/v') || (!contains(github.event.head_commit.message, '[skip module]') && !contains(github.event.head_commit.message, '[skip module build]')))"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ksu_module/webui/pnpm-lock.yaml

      - name: Install WebUI dependencies
        working-directory: ksu_module/webui
        run: pnpm install --frozen-lockfile

      - name: Build WebUI into module webroot
        working-directory: ksu_module/webui
        run: pnpm build

      # A release keeps the version of module.prop; any other build gets the commit appended
      # (v1.1.0-e34731a), so a module on the phone can be traced to its commit.
      - name: Add the commit to the version of a non-release build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: bash ci/stamp-module-version.sh ksu_module/kernel_control/module.prop "$GITHUB_SHA" "${{ github.run_number }}"

      - name: Package KernelSU module
        working-directory: ksu_module/kernel_control
        run: zip -r9 "../kernel_control-${{ github.run_number }}.zip" .

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_control-${{ github.run_number }}
          path: ksu_module/kernel_control-*.zip
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Update Unreleased pre-release
    # Only the 16.0 branch feeds the rolling pre-release, so feature branches
    # cannot overwrite it with a build that is not the newest work.
    # It runs when at least one build succeeded and the other one either succeeded or was
    # skipped, so a [skip kernel] or [skip module] push still publishes the part that was built.
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/16.0' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.module.result == 'success' || needs.module.result == 'skipped') && (needs.build.result == 'success' || needs.module.result == 'success')"
    needs: [build, module]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # Assets of the build that did not run stay in the release; empty when both ran.
      KEEP: ${{ needs.build.result != 'success' && 'miatoll-*|Image-*' || needs.module.result != 'success' && 'kernel_control-*' || '' }}
      BUILT: ${{ needs.build.result == 'success' && needs.module.result == 'success' && 'kernel and module' || needs.build.result == 'success' && 'kernel only' || 'module only' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.run_number }}"
          merge-multiple: true
          path: release-assets

      - name: Extract Unreleased notes from CHANGELOG.md
        run: |
          SECTION=$(awk '
            index($0, "## [Unreleased]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            SECTION="No entries in the Unreleased section yet."
          fi
          {
            echo "$SECTION"
            echo
            echo "Built from \`${GITHUB_SHA::7}\` (run ${{ github.run_number }}): $BUILT."
            if [ -n "$KEEP" ]; then
              echo "The other build was skipped for this commit, so its files are kept from an earlier run (the run number is in their names)."
            fi
          } > release-notes.md

      - name: Gather the new assets and the ones kept from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/prerelease-assets.sh gather unreleased "$KEEP" release-assets all-assets

      - name: Generate manifest.json
        env:
          REPO: ${{ github.repository }}
          TAG: unreleased
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/make-manifest.sh Unreleased all-assets release-assets/manifest.json

      - name: Move the unreleased tag to this commit
        run: |
          git tag -f unreleased "$GITHUB_SHA"
          git push -f origin refs/tags/unreleased

      - name: Clear the assets that this build replaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/prerelease-assets.sh clean unreleased "$KEEP"

      - name: Update the pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unreleased
          name: "Unreleased (build ${{ github.run_number }})"
          prerelease: true
          files: release-assets/*
          body_path: release-notes.md

  release:
    name: Attach zips to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, module]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.run_number }}"
          merge-multiple: true
          path: release-assets

      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          SECTION=$(awk -v ver="## [$VER]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "::error::CHANGELOG.md has no section [$VER]"
            exit 1
          fi
          echo "$SECTION" > release-notes.md

      - name: Generate manifest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/make-manifest.sh "${GITHUB_REF_NAME#v}" release-assets release-assets/manifest.json

      - name: Attest flashable zips provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release-assets/*.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/manifest.json
          body_path: release-notes.md
