# NetHunter fragment for miatoll (SM6250). Apply on top of
# miatoll_defconfig: scripts/kconfig/merge_config.sh \
#   arch/arm64/configs/vendor/xiaomi/miatoll_defconfig \
#   arch/arm64/configs/vendor/xiaomi/miatoll_nethunter.cfg
#
# External USB Wi-Fi (monitor mode + injection; the internal QCA CLD
# chip has FEATURE_MONITOR_MODE_SUPPORT=n, so sniffing needs a dongle),
# USB serial for consoles/radios, HID attack surface, and Ethernet
# dongles. Internal drivers (QCA_CLD_WLAN, RMNET/IPA, BT) stay in the
# base defconfig and are not repeated here.

# --- HID attack surface ---
CONFIG_HIDRAW=y
CONFIG_HID_GENERIC=y

# --- USB serial (consoles, SDR, radios, OTG adapters) ---
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_PL2303=y
CONFIG_USB_SERIAL_CH341=y
CONFIG_USB_SERIAL_OPTION=y
CONFIG_USB_ACM=y
CONFIG_USB_WDM=y

# --- USB Wi-Fi with monitor/inject: Atheros + Ralink (in-tree) ---
CONFIG_WLAN_VENDOR_ATH=y
CONFIG_ATH_COMMON=y
CONFIG_ATH9K_HW=y
CONFIG_ATH9K_COMMON=y
CONFIG_ATH9K_HTC=y
CONFIG_WLAN_VENDOR_RALINK=y
CONFIG_RT2X00_LIB_USB=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT3573=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_RT55XX=y

# --- USB Ethernet dongles ---
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_EEM=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_CDC_MBIM=y
CONFIG_USB_NET_RNDIS_HOST=y
CONFIG_USB_NET_DM9601=y
CONFIG_USB_NET_SMSC95XX=y
CONFIG_USB_NET_AX88179_178A=y
CONFIG_QMI_WWAN=y

# --- Wireless stack bits NetHunter tools expect ---
CONFIG_MAC80211_MESH=y
CONFIG_PACKET_DIAG=y
